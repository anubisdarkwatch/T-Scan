name: Firmware build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  platformio:
    name: PlatformIO ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [tdisplay, tembed-cc1101, tdongle-s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile firmware
        run: pio run -e ${{ matrix.environment }}

  preview:
    name: Desktop UI preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and render each display
        run: |
          mkdir -p /tmp/tscan-preview
          for spec in "240 135" "320 170" "160 80"; do
            set -- $spec
            g++ -std=c++17 -O2 -Itools/preview/stub -include cstring \
              -DSCR_W=$1 -DSCR_H=$2 tools/preview/host.cpp -o /tmp/tscan-preview/host
            mkdir -p /tmp/tscan-preview/${1}x${2}
            /tmp/tscan-preview/host /tmp/tscan-preview/${1}x${2}
          done

  tembed-image:
    name: T-Embed flashable image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install --upgrade platformio "esptool>=4.7,<5"
      - name: Compile T-Embed CC1101 firmware
        run: pio run -e tembed-cc1101
      - name: Package complete 0x0 ESP32-S3 image
        shell: bash
        run: |
          set -euo pipefail
          build=".pio/build/tembed-cc1101"
          boot_app="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          mkdir -p dist
          for part in "$build/bootloader.bin" "$build/partitions.bin" "$build/firmware.bin" "$boot_app"; do
            test -s "$part" || { echo "::error::Missing image component $part"; exit 1; }
          done
          python -m esptool --chip esp32s3 merge_bin \
            --flash_mode keep --flash_freq keep --flash_size keep \
            -o "dist/T-Scan-v1.3.1-tembed-cc1101-powerfix.bin" \
            0x0 "$build/bootloader.bin" \
            0x8000 "$build/partitions.bin" \
            0xe000 "$boot_app" \
            0x10000 "$build/firmware.bin"
          python -m esptool --chip esp32s3 image_info "$build/firmware.bin"
          python - <<'PY'
          from pathlib import Path
          p = Path("dist/T-Scan-v1.3.1-tembed-cc1101-powerfix.bin")
          b = p.read_bytes()
          assert b[0] == 0xE9, "Missing ESP bootloader at offset 0x0"
          assert b[0x10000] == 0xE9, "Missing app image at offset 0x10000"
          assert b[0x8000:0x8002] == b"\\xAA\\x50", "Missing partition table at 0x8000"
          assert len(b) > 0x10000 + 400_000, "Unexpectedly small firmware image"
          print(f"Verified flash image: {len(b):,} bytes; offsets 0x0/0x8000/0x10000")
          PY
          cd dist && sha256sum T-Scan-v1.3.1-tembed-cc1101-powerfix.bin > SHA256SUMS.txt
      - name: Publish flashable image
        uses: actions/upload-artifact@v4
        with:
          name: T-Scan-TEmbed-CC1101-v1.3.1-powerfix
          path: |
            dist/T-Scan-v1.3.1-tembed-cc1101-powerfix.bin
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
