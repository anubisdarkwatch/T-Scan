; T-Scan — Wi-Fi / BLE scanner for LilyGo boards with screens
; Build one:  pio run -e tdisplay  |  -e tembed-cc1101  |  -e tdongle-s3

[platformio]
default_envs = tdisplay, tembed-cc1101, tdongle-s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    h2zero/NimBLE-Arduino@1.4.3
common_flags =
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DSMOOTH_FONT=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; LilyGo TTGO T-Display — ESP32, 1.14" 240x135
[env:tdisplay]
board = esp32dev
board_build.partitions = huge_app.csv
upload_speed = 921600
build_flags =
    ${env.common_flags}
    -DBOARD_TDISPLAY=1
    -DST7789_DRIVER=1
    -DTFT_BACKLIGHT_ON=HIGH
    -DSCR_W=240
    -DSCR_H=135
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DSPI_FREQUENCY=27000000

; LilyGo T-Embed CC1101 — ESP32-S3, 1.9" 320x170, knob, 16 MB flash
; Display config mirrors LilyGo's Setup214_LilyGo_T_Embed_PN532.h
[env:tembed-cc1101]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_speed = 921600
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@1.12.3
build_flags =
    ${env.common_flags}
    -DBOARD_TEMBED_CC1101=1
    -DST7789_DRIVER=1
    -DTFT_BACKLIGHT_ON=HIGH
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUI_HINT='"turn: scroll  press: page  side: pause"'
    -DSCR_W=320
    -DSCR_H=170
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_INVERSION_ON=1
    -DTFT_MISO=10
    -DTFT_MOSI=9
    -DTFT_SCLK=11
    -DTFT_CS=41
    -DTFT_DC=16
    -DTFT_RST=-1
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; LilyGo T-Dongle S3 / S3 Plus — ESP32-S3, 0.96" ST7735 160x80, one button, APA102 LED
; Display config mirrors LilyGo's Setup209_LilyGo_T_Dongle_S3.h, plus USE_HSPI_PORT:
; with the default FSPI port, IDF 4.4 maps the S3 SPI registers to address 0 and the first display write crashes
[env:tdongle-s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_speed = 921600
build_flags =
    ${env.common_flags}
    -DBOARD_TDONGLE_S3=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUI_HINT='"click: next  hold: pause"'
    -DSCR_W=160
    -DSCR_H=80
    -DST7735_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DST7735_GREENTAB160x80=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=LOW
    -DSPI_FREQUENCY=27000000
